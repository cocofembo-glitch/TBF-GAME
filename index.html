<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Глубокий бур</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#1a1410;--panel:#2a2019;--ink:#fff1dc;--dim:#b09a80;--gold:#ffc83d;--ok:#8be08b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700}
.money{color:var(--gold);font-size:22px}.dim{color:var(--dim);font-size:13px;font-weight:400}
.bars{padding:0 12px 6px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:14px;background:#0006;border-radius:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;transition:width .1s}
.bar span{position:absolute;inset:0;font-size:10px;text-align:center;line-height:14px}
#e i{background:#5ec8ff}#c i{background:var(--gold)}
.cv{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative}
canvas{height:100%;max-width:100%;image-rendering:pixelated;border-radius:10px}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#000a;padding:6px 12px;border-radius:12px;opacity:0;transition:opacity .3s;font-weight:700;color:var(--ok);white-space:nowrap}
.ctl{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px}
.pad button{font-size:24px}
button{border:0;border-radius:14px;background:var(--panel);color:var(--ink);font:inherit;font-weight:700}
button:active{filter:brightness(1.4)}
.side{display:flex;flex-direction:column;gap:8px}
.side button{padding:14px 18px;font-size:15px}
.on{background:#2f6b2f!important}
#shop{position:absolute;inset:0;background:#000b;display:none;padding:12px;overflow:auto;z-index:5}
#shop.open{display:block}
.it{display:flex;align-items:center;gap:10px;width:100%;padding:12px;margin-bottom:8px;text-align:left}
.it:disabled{opacity:.45}.it small{display:block;color:var(--dim);font-weight:400}.it em{margin-left:auto;font-style:normal;color:var(--gold)}
/* ---- оформление интерфейса ---- */
body{background:radial-gradient(120% 70% at 50% 0,#4a2f1c 0,#1a1410 62%)}
.top{margin:8px 12px 6px;padding:10px 14px;background:linear-gradient(#3a2b20,#2a2019);border:1px solid #5b4330;border-radius:16px;box-shadow:0 4px 0 #120d09,inset 0 1px #ffffff18}
.money{text-shadow:0 2px 0 #7a4b00;letter-spacing:.02em}
.bar{height:18px;border:1px solid #0008;box-shadow:inset 0 2px 4px #0009}
.bar span{font-size:11px;line-height:16px;text-shadow:0 1px 2px #000}
#e i{background:linear-gradient(#8ee0ff,#2f9bd6)}#c i{background:linear-gradient(#ffe27a,#e0961a)}
canvas{border:3px solid #5b4330;box-shadow:0 0 0 3px #120d09,0 10px 24px #000a}
.pad button,.side button{background:linear-gradient(#4a3828,#33261b);border:1px solid #6a4f38;box-shadow:0 4px 0 #120d09,inset 0 1px #ffffff22;transition:transform .05s,box-shadow .05s}
.pad button:active,.side button:active{transform:translateY(3px);box-shadow:0 1px 0 #120d09;filter:none}
.side button.on{background:linear-gradient(#4aa84a,#2f6b2f)!important;border-color:#7ad67a}
#shopBtn{background:linear-gradient(#ffd45a,#e0961a);color:#3a2300;border-color:#ffe9a8}
#shop{background:#140e0bee;backdrop-filter:blur(3px)}
.it{background:linear-gradient(#3a2b20,#2a2019);border:1px solid #5b4330;box-shadow:0 3px 0 #120d09}
.it em{background:#0006;padding:4px 10px;border-radius:10px}
#toast{background:#120d09ee;border:1px solid #5b4330}
.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.side button{padding:10px 8px;font-size:14px}#rst{grid-column:1/3}
/* ---- чистый интерфейс ---- */
:root{--line:#3b2f25;--surf:#211a14;--surf2:#2d231a;--amber:#ffb84a}
body{background:#17110d}
.top{background:var(--surf);border:1px solid var(--line);box-shadow:none;border-radius:14px}
.money{font-size:21px;text-shadow:none;color:var(--amber)}
.bar{height:12px;border:0;border-radius:6px;background:#0008;box-shadow:none}
.bar i{border-radius:6px}
#e i{background:#4cc3ff}#c i{background:var(--amber)}
.bar span{font-size:9px;line-height:12px;font-weight:600;text-shadow:none}
canvas{border:1px solid var(--line);box-shadow:0 8px 24px #0009;border-radius:12px}
.ctl{padding:10px 14px 12px;gap:14px}
.pad{grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:6px}
.pad button,.side button{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surf);border:1px solid var(--line);border-radius:14px;box-shadow:none;color:#e9dccb;font-weight:600;font-size:14px;transition:background .12s,transform .08s}
.pad button svg,.side button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.pad button:active,.side button:active{background:#3a2d22;transform:scale(.96);box-shadow:none}
.side{flex:1;max-width:215px}
.side button{padding:0 10px;height:46px}
#shopBtn{background:var(--amber);color:#2a1a00;border-color:var(--amber)}
#auto.on{background:#1f3a24!important;border-color:#4fbf63!important;color:#7ae58d}
#rst{background:transparent;color:#a99b88;height:40px}
.side button.empty{opacity:.45}
#shop{background:#100b08f2;padding:14px}
.it{gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:14px;box-shadow:none;padding:10px 12px}
.it .ico{width:42px;height:42px;border-radius:11px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.it em{background:#ffb84a1f;color:var(--amber);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700}
.it:not(:disabled):active{background:#33281f}
#cl{justify-content:center;color:#a99b88}
#home{grid-column:1/3;background:var(--surf);border-color:var(--amber);color:var(--amber)}
/* ---- компактная раскладка ---- */
.top{margin:6px 10px 4px;padding:6px 10px;gap:10px}
.prof{display:flex;align-items:center;gap:8px;min-width:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--surf2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--amber);overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.pt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.pt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.pt .dim{font-size:11px;font-weight:400;white-space:nowrap}
.money{font-size:19px;flex:none}
.bars{padding:0 10px 4px;gap:6px}
.bar{height:11px}
.cv{padding:0 6px}
.ctl{padding:8px 12px;gap:10px}
.pad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:6px}
.side{flex:none;max-width:none;display:grid;grid-template-columns:repeat(3,46px);gap:6px}
.side button{width:46px;height:46px;padding:0}
.side .lb{display:none}
#dyn .lb,#bat .lb{display:block;position:absolute;top:3px;right:4px;font-size:10px;line-height:1;background:#000a;color:#fff;border-radius:6px;padding:2px 4px}
.side button{position:relative}
#home,#rst{grid-column:auto;height:46px}
</style>
</head>
<body>
<div class="top"><div class="prof"><div class="av" id="av"></div><div class="pt"><b id="pname">Игрок</b><span id="depth" class="dim"></span></div></div><div class="money" id="money">0 ₴</div></div>
<div class="bars"><div class="bar" id="e"><i></i><span></span></div><div class="bar" id="c"><i></i><span></span></div></div>
<div class="cv"><canvas id="cv" width="384" height="416"></canvas><div id="toast"></div>
<div id="shop"></div></div>
<div class="ctl">
  <div class="pad">
    <span></span><button data-d="0,-1" aria-label="Вверх"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button><span></span>
    <button data-d="-1,0" aria-label="Влево"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><button data-d="0,1" aria-label="Вниз"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button><button data-d="1,0" aria-label="Вправо"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>
  <div class="side"><button id="home" title="Домой" aria-label="Домой"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/></svg><span class="lb">Домой</span></button><button id="auto" title="Авто" aria-label="Авто"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l6 3.5-6 3.5z"/></svg><span class="lb">Авто</span></button><button id="shopBtn" title="Магазин" aria-label="Магазин"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span class="lb">Магазин</span></button><button id="dyn" title="Динамит"><svg viewBox="0 0 24 24"><circle cx="10" cy="14" r="6"/><path d="M14 10l3-3M17 7l1.5-2.5M16 4.5l3 1"/></svg><span class="lb">0</span></button><button id="bat" title="Батарейка"><svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"/></svg><span class="lb">0</span></button><button id="rst" title="Новая карта" aria-label="Новая карта"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 5v6h-6"/></svg><span class="lb">Новая карта</span></button></div>
</div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
// Автоматический вход по аккаунту Telegram: ни форм, ни паролей
const tu = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const uid = tu ? String(tu.id) : 'guest';
const KEY = 'deep_drill_v1';
(function(){ const n=tu?(tu.first_name||tu.username||'Игрок'):'Гость', av=document.getElementById('av');
  document.getElementById('pname').textContent=n; const ini=()=>{ av.textContent=n.charAt(0).toUpperCase(); };
  if(tu&&tu.photo_url){ const im=new Image(); im.alt=''; im.onerror=()=>{ im.remove(); ini(); }; im.src=tu.photo_url; av.appendChild(im); } else ini();
  try{ tg&&tg.disableVerticalSwipes&&tg.disableVerticalSwipes(); }catch(e){} })();

const T=32, W=12, H=240, VW=12, SURF=2; let VH=13;
const HARD=[0,1,2.2,1.3,1.6,2.1,3,2.4,3.4,4], VAL=[0,0,0,5,15,50,200,90,350,700];
const NAMES=['','Земля','Камень','Медь','Железо','Золото','Алмаз','Топаз','Рубин','Изумруд'];
const COL=['','#7a5230','#6d6b72','#e08a4a','#c9d3dd','#ffd23f','#6ff0ff','#ffa63a','#ff3b5c','#3dff8a'];

let P = {money:0, up:{drill:0,cargo:0,tank:0,bot:0,sell:0,eff:0,fortune:0,turbo:0,rescue:0,lamp:0,magnet:0,geo:0,drone:0,regen:0}, best:0, dyn:0, bat:0};
const emptyCargo=()=>new Array(10).fill(0);
const floats=[];
function pop(x,y,t,a){ floats.push({x,y,t,a,born:performance.now()}); if(floats.length>12) floats.shift(); }
const UPS = [
  {id:'drill', ic:'⛏️', name:'Мощный бур',   d:'Копает быстрее', base:40,  m:1.7},
  {id:'cargo', ic:'📦', name:'Большой трюм',  d:'+8 места',       base:30,  m:1.6},
  {id:'tank',  ic:'🔋', name:'Ёмкий бак',     d:'+30 энергии',    base:35,  m:1.6},
  {id:'bot',   ic:'🤖', name:'Робот-пилот',   d:'Копает сам, возвращается продавать (макс. ур. 3)', base:250, m:3, max:3},
  {id:'sell',  ic:'💰', name:'Торговец',        d:'+12% к цене продажи (макс. 10)', base:60, m:1.75, max:10},
  {id:'eff',   ic:'⚙️', name:'Экономный мотор', d:'7% шагов без затрат энергии (макс. 8)', base:70, m:1.7, max:8},
  {id:'fortune',ic:'🍀', name:'Удача шахтёра',   d:'8% шанс двойной добычи (макс. 8)', base:90, m:1.8, max:8},
  {id:'turbo', ic:'🏎️', name:'Турбо-ход',       d:'Быстрее ездить по готовым тоннелям (макс. 6)', base:50, m:1.7, max:6},
  {id:'rescue',ic:'🛟', name:'Спасательный модуль', d:'Без энергии сохраняет 25% руды за ур. (макс. 4)', base:120, m:2.2, max:4},
  {id:'lamp',  ic:'🔦', name:'Мощный фонарь',   d:'Меньше темноты на глубине (макс. 5)', base:80, m:1.8, max:5},
  {id:'magnet',ic:'🧲', name:'Магнит',          d:'10% шанс притянуть соседнюю руду (макс. 5)', base:150, m:1.9, max:5},
  {id:'geo',   ic:'🧭', name:'Геолог',          d:'Больше руды и камней на новой карте (макс. 5)', base:200, m:2, max:5},
  {id:'drone', ic:'🚀', name:'Ускоритель робота',d:'Робот копает и ездит быстрее (макс. 4)', base:300, m:2.3, max:4},
  {id:'regen', ic:'♻️', name:'Рекуперация',     d:'Подъём наверх тратит меньше энергии (макс. 4)', base:180, m:2, max:4}
];
const lvl = id => P.up[id];
const cost = u => Math.floor(u.base*Math.pow(u.m,lvl(u.id)));
const digMul = () => Math.pow(0.82, lvl('drill'));
const capMax = () => 10 + 8*lvl('cargo');
const enMax  = () => 60 + 30*lvl('tank');

let world=[], pl, cargo, energy, dir=[0,0], cd=0, auto=false;
function gen(){
  world=[];
  for(let y=0;y<H;y++){ const r=[]; for(let x=0;x<W;x++){
    if(y<=SURF){r.push(0);continue;}
    const d=y-SURF, q=Math.random(); let t=1;
    if(Math.random()<Math.min(.55,d/160)) t=2;
    if(q<.13+.012*lvl('geo')){ const o=Math.random()/(1+.25*lvl('geo'));
      t = d>100&&o<.04?9 : d>70&&o<.07?8 : d>55&&o<.10?6 : d>40&&o<.12?7 : d>28&&o<.2?5 : d>9&&o<.5?4 : 3; }
    r.push(t);} world.push(r);}
  pl={x:6,y:SURF}; cargo=emptyCargo(); energy=enMax();
}
const cargoN = () => cargo.reduce((a,b)=>a+b,0);

function toast(s){ const t=document.getElementById('toast'); t.textContent=s; t.style.opacity=1; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.opacity=0,1600); }
function sell(){
  let sum=0; for(let i=3;i<10;i++) sum+=cargo[i]*VAL[i]; sum=Math.round(sum*(1+.12*lvl('sell')));
  if(sum>0){ P.money+=sum; toast('Продано: +'+sum+' ₴'); tg&&tg.HapticFeedback&&tg.HapticFeedback.notificationOccurred('success'); save(); }
  cargo=emptyCargo(); energy=enMax();
}

function step(){
  if(auto && lvl('bot')>0) dir=aiDir();
  if(!dir[0] && !dir[1]) return;
  const nx=pl.x+dir[0], ny=pl.y+dir[1];
  if(nx<0||nx>=W||ny<0||ny>=H) return;
  if(energy<=0){ toast('Нет энергии! Робот-спасатель вернул вас наверх'); const k=.25*lvl('rescue'); cargo=cargo.map(n=>Math.floor(n*k)); pl={x:6,y:SURF}; sell(); return; }
  const t=world[ny][nx];
  if(t){
    if(t>=3 && cargoN()>=capMax()){ toast('Трюм полон — поднимитесь наверх'); cd=.25; return; }
    cd = .28*HARD[t]*digMul()*(auto?Math.pow(.8,lvl('drone')):1);
    if(t>=3){ const a=Math.random()<.08*lvl('fortune')?2:1; cargo[t]+=a; pop(nx,ny,t,a); }
    if(lvl('magnet')) [[1,0],[-1,0],[0,1],[0,-1]].forEach(([mx,my])=>{ const X=nx+mx,Y=ny+my; if(X<0||X>=W||Y<=SURF||Y>=H) return; const u=world[Y][X]; if(u>=3&&cargoN()<capMax()&&Math.random()<.1*lvl('magnet')){ world[Y][X]=0; cargo[u]++; pop(X,Y,u,1); } });
    world[ny][nx]=0;
  } else cd=.13*Math.pow(.85,lvl('turbo'))*(auto?Math.pow(.8,lvl('drone')):1);
  pl.x=nx; pl.y=ny; if(Math.random()>=.07*lvl('eff')+(dir[1]<0?.2*lvl('regen'):0)) energy--;
  if(ny-SURF>P.best){ P.best=ny-SURF; }
  if(pl.y<=SURF) sell();
}
function aiDir(){
  const back = cargoN()>=capMax() || energy < (pl.y-SURF)*1.3+10;
  if(back) return pl.x!==6 && pl.y>SURF+2 ? [0,-1] : [0,-1];
  let best=null,bd=99;
  const R=2+2*lvl('bot'); for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    const x=pl.x+dx,y=pl.y+dy; if(x<0||x>=W||y<=SURF||y>=H) continue;
    if(world[y][x]>=3){ const d=Math.abs(dx)+Math.abs(dy); if(d<bd){bd=d;best=[dx,dy];} } }
  if(best){ return best[0]?[Math.sign(best[0]),0]:[0,Math.sign(best[1])]; }
  return [0,1];
}

const cv=document.getElementById('cv'), g=cv.getContext('2d');

// ---- текстуры: рисуются один раз и кэшируются ----
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shade(hex,a){ const n=parseInt(hex.slice(1),16), f=c=>Math.round(a<0?c*(1+a):c+(255-c)*a); return 'rgb('+f(n>>16)+','+f(n>>8&255)+','+f(n&255)+')'; }
const DIRT=[['#98633b','#6b4226'],['#8a5430','#5f3a22'],['#76493c','#4f2f2f'],['#5e3f4a','#3b2a3a']], STONE=[['#8a8894','#5d5b67'],['#7e8896','#555f70'],['#6e728c','#474a63'],['#58567a','#38365a']];
function mkTex(t,v,ti){
  const c=document.createElement('canvas'); c.width=c.height=T; const k=c.getContext('2d'), R=rng(t*97+v*31+ti*13+7), rs=(a,b)=>a+R()*(b-a);
  if(t===0){
    const gd=k.createLinearGradient(0,0,0,T); gd.addColorStop(0,'#1a120d'); gd.addColorStop(1,'#2d1e15'); k.fillStyle=gd; k.fillRect(0,0,T,T);
    for(let i=0;i<14;i++){ k.fillStyle=R()<.5?'#ffffff0a':'#00000030'; k.fillRect(R()*T|0,R()*T|0,2,2); }
    for(let i=0;i<2;i++){ k.fillStyle='#4a3626'; k.fillRect(R()*26|0,T-3-(R()*2|0),3,2); }
    return c; }
  const base=t===1?DIRT[ti]:STONE[ti];
  const gd=k.createLinearGradient(0,0,T,T); gd.addColorStop(0,base[0]); gd.addColorStop(1,base[1]); k.fillStyle=gd; k.fillRect(0,0,T,T);
  for(let i=0;i<46;i++){ k.fillStyle=R()<.5?'#ffffff1a':'#00000026'; const z=R()<.3?3:2; k.fillRect(R()*T|0,R()*T|0,z,z); }
  for(let i=0;i<3;i++){ const ax=rs(0,T),ay=rs(0,T),rg=k.createRadialGradient(ax,ay,0,ax,ay,14); rg.addColorStop(0,'#00000038'); rg.addColorStop(1,'#00000000'); k.fillStyle=rg; k.fillRect(0,0,T,T); }
  if(t!==1) for(let i=0;i<5;i++){ k.fillStyle='#ffffff90'; k.fillRect(R()*T|0,R()*T|0,1,1); }
  if(t===1){
    for(let i=0;i<3;i++){ const x=rs(4,27),y=rs(4,27); k.fillStyle='#00000040'; k.beginPath(); k.ellipse(x+1,y+1.5,3.5,2.5,0,0,7); k.fill(); k.fillStyle='#bba98f'; k.beginPath(); k.ellipse(x,y,3,2.2,0,0,7); k.fill(); k.fillStyle='#ffffff66'; k.fillRect(x-1.5,y-1.5,2,1); }
    k.strokeStyle='#4f3019'; k.lineWidth=1; k.beginPath(); let x=rs(0,8),y=rs(4,26); k.moveTo(x,y); for(let i=0;i<4;i++){ x+=rs(4,8); y+=rs(-4,4); k.lineTo(x,y); } k.stroke();
  } else {

const TEXS={};
function tex(t,x,y){ const v=((x*73856093^y*19349663)>>>0)%3, ti=Math.min(3,Math.max(0,((y-SURF)/45)|0)), key=(t*3+v)*4+ti; return TEXS[key]||(TEXS[key]=mkTex(t,v,ti)); }
const SHD=document.createElement('canvas'); SHD.width=T; SHD.height=9; { const k=SHD.getContext('2d'), sh=k.createLinearGradient(0,0,0,9); sh.addColorStop(0,'#000a'); sh.addColorStop(1,'#0000'); k.fillStyle=sh; k.fillRect(0,0,T,9); }
let GR; function mkGR(){ GR=g.createLinearGradient(0,0,0,cv.height); GR.addColorStop(0,'#0000'); GR.addColorStop(1,'#000'); } mkGR();
function blob(x,y,r){ g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }

  [[0,gy-92,1],[170,gy-68,.8]].forEach(([o,cy,z])=>{ const cx=((now/90+o)%520)-70; blob(cx,cy,12*z); blob(cx+14*z,cy-6*z,15*z); blob(cx+30*z,cy,12*z); g.fillRect(cx,cy,30*z,12*z); });

  g.fillStyle='#8f2f2a'; g.beginPath(); g.moveTo(T-6,gy-56); g.lineTo(T+46,gy-82); g.lineTo(T+98,gy-56); g.closePath(); g.fill();

  g.fillStyle='#4a2c14'; g.fillRect(T+10,gy-30,18,30); g.fillStyle='#ffd23f'; blob(T+24,gy-14,1.5);
  g.fillStyle='#ffe9a0'; g.fillRect(T+46,gy-38,26,18); g.strokeStyle='#4a2c14'; g.lineWidth=2; g.strokeRect(T+46,gy-38,26,18); g.beginPath(); g.moveTo(T+59,gy-38); g.lineTo(T+59,gy-20); g.stroke();

function grassTop(px,py,x){ g.fillStyle='#3c8f31'; g.fillRect(px,py,T,7); g.fillStyle='#5cc044'; g.fillRect(px,py,T,4); g.fillStyle='#86e068'; g.fillRect(px,py,T,1.5);
  g.fillStyle='#5cc044'; for(let i=0;i<5;i++){ const bx=px+i*7+((x*13+i*5)%4); g.beginPath(); g.moveTo(bx,py); g.lineTo(bx+2,py-4-(i+x)%3); g.lineTo(bx+4,py); g.fill(); } }

const A=(xx,yy)=>yy>SURF&&xx>=0&&xx<W&&yy<H&&!world[yy][xx];
function draw(){
  const camY=Math.max(0,Math.min(H-VH,pl.y-(VH>>1)));
  const tnow=performance.now();
  if(camY<=SURF){ const sk=g.createLinearGradient(0,0,0,Math.max(60,(SURF+1-camY)*T)); sk.addColorStop(0,'#4fb6ff'); sk.addColorStop(1,'#d6f1ff'); g.fillStyle=sk; g.fillRect(0,0,cv.width,cv.height); scenery(camY,tnow); }
  for(let vy=0;vy<VH;vy++){ const y=camY+vy;
    for(let x=0;x<W;x++){ const t=world[y][x], px=x*T, py=vy*T;
      if(!t){ if(y>SURF){ g.drawImage(tex(0,x,y),px,py); if(y>SURF+1&&world[y-1][x]) g.drawImage(SHD,px,py); } continue; }
      g.drawImage(tex(t,x,y),px,py);
      if(y===SURF+1) grassTop(px,py,x);
      if(A(x,y-1)){ g.fillStyle='#ffffff30'; g.fillRect(px,py,T,2); } if(A(x-1,y)){ g.fillStyle='#ffffff22'; g.fillRect(px,py,2,T); }
      if(A(x,y+1)){ g.fillStyle='#00000066'; g.fillRect(px,py+T-3,T,3); } if(A(x+1,y)){ g.fillStyle='#00000055'; g.fillRect(px+T-3,py,3,T); }
      if(t>=6&&Math.sin(tnow/260+x*1.7+y*2.3)>.8){ const sx=px+(x*7+y*3)%22+5, sy=py+(x*5+y*11)%22+5; g.fillStyle='#fff'; g.fillRect(sx-3,sy,7,1); g.fillRect(sx,sy-3,1,7); }
    } }
  // бур
  drawDrill(pl.x*T+T/2,(pl.y-camY)*T+T/2);
  // тень глубины
  if(pl.y>SURF+3){ g.globalAlpha=Math.min(.75,(pl.y-SURF-3)/80)*Math.max(.25,1-.16*lvl('lamp')); g.fillStyle=GR; g.fillRect(0,0,cv.width,cv.height); g.globalAlpha=1; }
  // всплывающие названия руды
  const now=performance.now();
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i], k=(now-f.born)/1100;
    if(k>=1){ floats.splice(i,1); continue; }
    const gem=f.t>=6, fx=Math.max(48,Math.min(cv.width-48,f.x*T+T/2)), fy=(f.y-camY)*T+T/2-8-k*30;
    g.save(); g.globalAlpha=k<.7?1:1-(k-.7)/.3; g.textAlign='center';
    g.font='bold '+(gem?17:14)+'px "Trebuchet MS",sans-serif';
    g.shadowColor=COL[f.t]; g.shadowBlur=gem?16:9;
    g.lineWidth=3; g.strokeStyle='#000c'; const txt=NAMES[f.t]+(f.a>1?' ×'+f.a:'');
    g.strokeText(txt,fx,fy); g.fillStyle=COL[f.t]; g.fillText(txt,fx,fy); g.restore(); }
}
let face=0, spin=0;
function drawDrill(cx,cy){

  let df=tgt-face; while(df>Math.PI)df-=2*Math.PI; while(df<-Math.PI)df+=2*Math.PI;
  face+=df*.35; const moving=!!(dir[0]||dir[1]); spin+=moving?1:.25;
  g.save(); g.translate(cx,cy); g.rotate(face);
  if(moving){ const lg=g.createLinearGradient(0,10,0,38); lg.addColorStop(0,'#fff3a866'); lg.addColorStop(1,'#fff3a800'); g.fillStyle=lg; g.beginPath(); g.moveTo(-5,10); g.lineTo(5,10); g.lineTo(15,38); g.lineTo(-15,38); g.closePath(); g.fill(); }
  for(const sx of [-14,8]){
    g.fillStyle='#17171c'; g.fillRect(sx,-13,6,26); g.fillStyle='#34343d'; g.fillRect(sx+1,-12,4,24);
    g.fillStyle='#74747f'; for(let i=0;i<6;i++){ const o=((spin*2+i*5)%30)-14; if(o>-13&&o<11) g.fillRect(sx,o,6,2); }
    g.fillStyle='#a6a6b2'; g.fillRect(sx+2,-10,2,2); g.fillRect(sx+2,8,2,2); }
  const bd=g.createLinearGradient(-9,0,9,0); bd.addColorStop(0,'#ffa352'); bd.addColorStop(.5,'#ff7a2f'); bd.addColorStop(1,'#bf4a17'); g.fillStyle=bd; g.fillRect(-9,-12,18,19);
  g.strokeStyle='#6e2708'; g.lineWidth=1; g.strokeRect(-9,-12,18,19);
  g.fillStyle='#ffd1a0'; g.fillRect(-9,-12,18,2);
  g.fillStyle='#ffffff80'; [[-8,3],[6.5,3],[-8,-10],[6.5,-10]].forEach(([a,b])=>g.fillRect(a,b,1.5,1.5));
  g.fillStyle='#ffd23f'; for(let i=0;i<4;i++) g.fillRect(-9+i*5,4,3,2);
  g.fillStyle='#2a2f3a'; g.fillRect(-6,-9,12,9);
  const gl=g.createLinearGradient(0,-9,0,0); gl.addColorStop(0,'#c6eeff'); gl.addColorStop(1,'#4aa6dc'); g.fillStyle=gl; g.fillRect(-5,-8,10,7);
  g.fillStyle='#3b2a1e'; g.fillRect(-2,-5,4,4); g.fillStyle='#ffcf33'; g.fillRect(-2.5,-6.5,5,2.5); g.fillStyle='#fff'; g.fillRect(-1,-6.2,2,1);
  g.fillStyle='#ffffff88'; g.fillRect(-4,-7.5,2,1);
  g.fillStyle=(auto&&lvl('bot')>0)?'#5dff7a':'#ffe27a'; g.fillRect(-1.5,1.5,3,2);
  const dg=g.createLinearGradient(-8,0,8,0); dg.addColorStop(0,'#868a96'); dg.addColorStop(.45,'#eceef4'); dg.addColorStop(1,'#646874'); g.fillStyle=dg;
  g.beginPath(); g.moveTo(-8,7); g.lineTo(8,7); g.lineTo(1.5,19); g.lineTo(-1.5,19); g.closePath(); g.fill();
  g.strokeStyle='#4b4f5a'; g.lineWidth=1.6;
  for(let i=0;i<4;i++){ const k=((spin*1.4+i*2.6)%10.4)/10.4, w=8*(1-k)+1; g.beginPath(); g.moveTo(-w,7+12*k+1); g.lineTo(w,7+12*k-1); g.stroke(); }
  if(moving){ g.fillStyle='#3b3b44'; g.fillRect(4,-15,3,3); for(let i=0;i<3;i++){ const o=(spin*.8+i*3.4)%10; g.globalAlpha=.45*(1-o/10); g.fillStyle='#d9d4cc'; g.beginPath(); g.arc(5.5+Math.sin(o*1.3)*1.5,-16-o*1.2,1.5+o*.25,0,7); g.fill(); } g.globalAlpha=1; }

  g.restore();
}

const $=id=>document.getElementById(id);
const EL={money:$('money'),depth:$('depth'),e:$('e'),c:$('c'),dyn:$('dyn'),bat:$('bat')}; EL.dl=EL.dyn.querySelector('.lb'); EL.bl=EL.bat.querySelector('.lb');
let hk='';
function hud(){
  const d=Math.max(0,pl.y-SURF), cn=cargoN(), key=[P.money,P.dyn,P.bat,d,P.best,energy,cn,capMax(),enMax()].join('|');
  if(key===hk) return; hk=key;
  EL.money.textContent=P.money+' ₴'; EL.dl.textContent=P.dyn; EL.bl.textContent=P.bat; EL.dyn.classList.toggle('empty',P.dyn<1); EL.bat.classList.toggle('empty',P.bat<1);
  EL.depth.textContent='Глубина '+d+' м · рекорд '+P.best+' м';
  EL.e.firstChild.style.width=(energy/enMax()*100)+'%'; EL.e.lastChild.textContent='Энергия '+energy+'/'+enMax();
  EL.c.firstChild.style.width=(cn/capMax()*100)+'%'; EL.c.lastChild.textContent='Трюм '+cn+'/'+capMax();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now; cd-=dt;
  if(cd<=0) step();
  draw(); hud(); requestAnimationFrame(loop);
}

// Управление
document.querySelectorAll('.pad button').forEach(b=>{
  const d=b.dataset.d.split(',').map(Number);
  b.addEventListener('pointerdown',e=>{ auto=false; syncAuto(); dir=d; });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{ if(dir===d) dir=[0,0]; }));
});
function syncAuto(){ const b=document.getElementById('auto'); b.classList.toggle('on',auto); b.querySelector('.lb').textContent=auto?'Авто: вкл':'Авто'; if(!auto) dir=[0,0]; }
document.getElementById('auto').onclick=()=>{
  if(!lvl('bot')){ toast('Сначала купите Робота-пилота'); return; }
  auto=!auto; syncAuto(); };

// Динамит, батарейка, новая карта
document.getElementById('dyn').onclick=()=>{
  if(P.dyn<1){ toast('Динамит покупается в магазине'); return; }
  if(pl.y<=SURF+1){ toast('Взрывать можно под землёй'); return; }
  P.dyn--; let n=0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const x=pl.x+dx,y=pl.y+dy;
    if(x<0||x>=W||y<=SURF||y>=H||!world[y][x]||(dx===0&&dy===0)) continue;
    const t=world[y][x]; if(t>=3&&cargoN()<capMax()){ cargo[t]++; n++; pop(x,y,t,1); } world[y][x]=0; }
  toast('Бум! Добыто руды: '+n); tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('heavy'); save(); };
document.getElementById('bat').onclick=()=>{
  if(P.bat<1){ toast('Батарейки покупаются в магазине'); return; }
  P.bat--; energy=Math.min(enMax(),energy+Math.ceil(enMax()/2)); toast('Энергия пополнена'); save(); };
document.getElementById('home').onclick=()=>{
  if(pl.y<=SURF){ toast('Вы уже дома'); return; }
  auto=false; syncAuto(); dir=[0,0]; pl={x:6,y:SURF}; cd=.2;
  const had=cargoN(); sell(); if(!had) toast('Вы дома. Энергия восстановлена');
  tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred('medium'); };
document.getElementById('rst').onclick=()=>{ auto=false; syncAuto(); sell(); gen(); toast('Новая карта: руда снова на месте!'); };

// Магазин
const shop=document.getElementById('shop');
function renderShop(){
  shop.innerHTML='<button class="it" id="cl">Закрыть</button>';
  UPS.forEach(u=>{ const maxed=u.max&&lvl(u.id)>=u.max, c=cost(u);
    const b=document.createElement('button'); b.className='it'; b.disabled=maxed||P.money<c;
    b.innerHTML=`<span class="ico">${u.ic}</span><span>${u.name} · ур. ${lvl(u.id)}<small>${u.d}</small></span><em>${maxed?'макс':c+' ₴'}</em>`;
    b.onclick=()=>{ P.money-=c; P.up[u.id]++; energy=Math.min(energy,enMax()); save(); renderShop(); };
    shop.appendChild(b); });
  [{ic:'💣',n:'Динамит ×3',d:'Взрывает область 3×3 вокруг бура',c:40,f:()=>P.dyn+=3},
   {ic:'🧨',n:'Динамит ×10',d:'Выгодный набор',c:120,f:()=>P.dyn+=10},
   {ic:'⚡',n:'Батарейка',d:'+50% энергии в любом месте',c:30,f:()=>P.bat++},
   {ic:'🔋',n:'Батареи ×3',d:'Выгоднее, чем по одной',c:80,f:()=>P.bat+=3}].forEach(o=>{
    const b=document.createElement('button'); b.className='it'; b.disabled=P.money<o.c;
    b.innerHTML=`<span class="ico">${o.ic}</span><span>${o.n}<small>${o.d}</small></span><em>${o.c} ₴</em>`;
    b.onclick=()=>{ P.money-=o.c; o.f(); save(); renderShop(); }; shop.appendChild(b); });
  document.getElementById('cl').onclick=()=>shop.classList.remove('open');
}
document.getElementById('shopBtn').onclick=()=>{ if(pl.y>SURF){ toast('Магазин доступен на поверхности'); return; } renderShop(); shop.classList.add('open'); };

// Сохранение: облако Telegram (по аккаунту) + localStorage
function save(){
  const s=JSON.stringify(P);
  try{ localStorage.setItem(KEY+':'+uid,s); }catch(e){}
  try{ tg&&tg.CloudStorage&&tg.CloudStorage.setItem(KEY,s); }catch(e){}
}
function load(){ return new Promise(res=>{
  let local=null; try{ local=JSON.parse(localStorage.getItem(KEY+':'+uid)); }catch(e){}
  if(tg&&tg.CloudStorage){ try{ tg.CloudStorage.getItem(KEY,(err,v)=>{ let c=null; try{c=v&&JSON.parse(v);}catch(e){}
    res([c,local].filter(Boolean).sort((a,b)=>(b.money+b.best*50)-(a.money+a.best*50))[0]||null); }); return; }catch(e){} }
  res(local); }); }
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });

function fit(){
  const r=cv.parentElement.getBoundingClientRect(); if(!r.width||!r.height) return;
  const w=Math.min(r.width-4,720), k=w/384, rows=Math.max(8,Math.min(22,Math.floor((r.height-4)/k/T)));
  if(rows!==VH){ VH=rows; cv.height=VH*T; mkGR(); }
  cv.style.width=w+'px'; cv.style.height=(VH*T*k)+'px'; }
window.addEventListener('resize',fit); if(window.ResizeObserver) new ResizeObserver(fit).observe(cv.parentElement);
if(tg&&tg.onEvent) tg.onEvent('viewportChanged',fit); fit();
load().then(s=>{ if(s) P=Object.assign(P,s,{up:Object.assign(P.up,s.up)}); gen(); requestAnimationFrame(loop); });
