.top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;font-weight:700}
.money{color:var(--gold);font-size:22px}.dim{color:var(--dim);font-size:13px;font-weight:400}
.bars{padding:0 12px 6px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:14px;background:#0006;border-radius:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;width:0;transition:width .1s}
.bar span{position:absolute;inset:0;font-size:10px;text-align:center;line-height:14px}
#e i{background:#5ec8ff}#c i{background:var(--gold)}
.cv{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;position:relative}
canvas{height:100%;max-width:100%;image-rendering:pixelated;border-radius:10px}

.ctl{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px}
.pad button{font-size:24px}
button{border:0;border-radius:14px;background:var(--panel);color:var(--ink);font:inherit;font-weight:700}
button:active{filter:brightness(1.4)}
.side{display:flex;flex-direction:column;gap:8px}
.side button{padding:14px 18px;font-size:15px}
.on{background:#2f6b2f!important}
#shop{position:absolute;inset:0;background:#000b;display:none;padding:12px;overflow:auto;z-index:5}
#shop.open{display:block}
.it{display:flex;align-items:center;gap:10px;width:100%;padding:12px;margin-bottom:8px;text-align:left}
.it:disabled{opacity:.45}.it small{display:block;color:var(--dim);font-weight:400}.it em{margin-left:auto;font-style:normal;color:var(--gold)}

body{background:radial-gradient(120% 70% at 50% 0,#4a2f1c 0,#1a1410 62%)}
.top{margin:8px 12px 6px;padding:10px 14px;background:linear-gradient(#3a2b20,#2a2019);border:1px solid #5b4330;border-radius:16px;box-shadow:0 4px 0 #120d09,inset 0 1px #ffffff18}

.pad button:active,.side button:active{transform:translateY(3px);box-shadow:0 1px 0 #120d09;filter:none}
.side button.on{background:linear-gradient(#4aa84a,#2f6b2f)!important;border-color:#7ad67a}
#shopBtn{background:linear-gradient(#ffd45a,#e0961a);color:#3a2300;border-color:#ffe9a8}
#shop{background:#140e0bee;backdrop-filter:blur(3px)}
.it{background:linear-gradient(#3a2b20,#2a2019);border:1px solid #5b4330;box-shadow:0 3px 0 #120d09}
.it em{background:#0006;padding:4px 10px;border-radius:10px}
#toast{background:#120d09ee;border:1px solid #5b4330}
.side{display:grid;grid-template-columns:1fr 1fr;gap:8px}.side button{padding:10px 8px;font-size:14px}#rst{grid-column:1/3}

#auto.on{background:#1f3a24!important;border-color:#4fbf63!important;color:#7ae58d}
#rst{background:transparent;color:#a99b88;height:40px}
.side button.empty{opacity:.45}

.av img{width:100%;height:100%;object-fit:cover}

.pt b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44vw}
.pt .dim{font-size:11px;font-weight:400;white-space:nowrap}

.side{flex:none;max-width:none;display:grid;grid-template-columns:repeat(3,46px);gap:6px}
.side button{width:46px;height:46px;padding:0}
.side .lb{display:none}

[hidden]{display:none!important}
#splash{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 40%,#0b52cc 0,#023d9d 45%,#021f5c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .55s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-logo{position:relative;width:min(52vw,230px);aspect-ratio:362/466;animation:enter .8s cubic-bezier(.2,.8,.2,1),breathe 2.6s ease-in-out .8s infinite}
.sp-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sp-base{opacity:.2}
.sp-fill{clip-path:inset(100% 0 0 0);filter:drop-shadow(0 0 16px #9fc2ff88)}
.shine{position:absolute;inset:0;opacity:.7;background:linear-gradient(115deg,transparent 40%,#ffffffe6 50%,transparent 60%);background-size:260% 100%;background-position:130% 0;animation:sweep 1.9s ease-in-out infinite;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.sp-hint{font:600 13px "Trebuchet MS",sans-serif;color:#b9d0ff;letter-spacing:.12em}
@keyframes sweep{to{background-position:-130% 0}}
@keyframes breathe{50%{transform:scale(1.035)}}
@keyframes enter{from{opacity:0;transform:scale(.82)}}
.sp-dots{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sp-dots i{position:absolute;bottom:-10px;width:var(--s,3px);height:var(--s,3px);border-radius:50%;background:#cfe0ff;opacity:0;animation:rise 7s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.55}100%{transform:translateY(-105vh);opacity:0}}
.sp-glow{position:absolute;left:50%;top:44%;width:min(95vw,430px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#6aa4ff77 0,#6aa4ff00 62%);translate:-50% -50%;opacity:var(--v,0);scale:calc(.7 + var(--v,0)*.4);pointer-events:none}
.sp-edge{position:absolute;inset:0;background:linear-gradient(to bottom,transparent,#fff 50%,transparent) no-repeat;background-size:100% 12%;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;filter:drop-shadow(0 0 5px #fff);opacity:0}
#splash.done .sp-logo{animation:pop .55s ease-in forwards}
#splash.done .sp-hint{opacity:0;transition:opacity .2s}
@keyframes pop{0%{transform:scale(1);filter:brightness(1)}45%{transform:scale(1.1);filter:brightness(1.7)}100%{transform:scale(1.45);opacity:0}}
@media (prefers-reduced-motion:reduce){.sp-dots i,#splash.done .sp-logo{animation:none}}

  if(t){
    if(t>=3 && cargoN()>=capMax() && !auto){ toast('Трюм полон — нажмите «Домой»'); cd=.25; return; }
    cd = .28*HARD[t]*digMul()*(HARD[t]>=2?Math.pow(.92,lvl('cooler')):1)*(auto?Math.pow(.8,lvl('drone')):1);

}
function aiDir(){
  const back = cargoN()>=capMax() || energy < (pl.y-SURF)*1.3+10;
  if(back) return pl.x!==6 && pl.y>SURF+2 ? [0,-1] : [0,-1];

  if(best){ return best[0]?[Math.sign(best[0]),0]:[0,Math.sign(best[1])]; }

}

  { const hd=document.createElement('div'); hd.className='sec'; hd.textContent='Прогресс'; shop.appendChild(hd);
    const rb=document.createElement('button'); rb.className='it'; rb.innerHTML='<span>Сбросить прогресс<small>Деньги и улучшения обнулятся, рекорд глубины останется</small></span>';
    rb.onclick=()=>{ const sp=rb.querySelector('span');
      if(!rb.dataset.arm){ rb.dataset.arm='1'; sp.firstChild.textContent='Точно сбросить? Нажмите ещё раз'; setTimeout(()=>{ if(rb.isConnected){ delete rb.dataset.arm; sp.firstChild.textContent='Сбросить прогресс'; } },4000); return; }
      for(const k in P.up) P.up[k]=0; P.money=0; P.dyn=0; P.bat=0; auto=false; syncAuto(); gen(); save();
      shop.classList.remove('open','fresh'); toast('Прогресс сброшен. Начинаем заново!'); };
    shop.appendChild(rb); }
  [...shop.children].forEach((el,i)=>el.style.setProperty('--i',i)); shop.scrollTop=st; pulseId=null;
  document.getElementById('cl').onclick=()=>{ shop.classList.add('closing'); setTimeout(()=>shop.classList.remove('open','closing','fresh'),190); };
}
document.getElementById('shopBtn').onclick=()=>{ if(pl.y>SURF){ toast('Магазин доступен на поверхности'); return; } renderShop(); shop.classList.remove('closing'); shop.classList.add('open','fresh'); setTimeout(()=>shop.classList.remove('fresh'),900); };

// Сохранение: облако Telegram (по аккаунту) + localStorage
function save(){
  const s=JSON.stringify(P);
  try{ localStorage.setItem(KEY+':'+uid,s); }catch(e){}
  try{ tg&&tg.CloudStorage&&tg.CloudStorage.setItem(KEY,s); }catch(e){}
}
function load(){ return new Promise(res=>{
  let local=null; try{ local=JSON.parse(localStorage.getItem(KEY+':'+uid)); }catch(e){}
  if(tg&&tg.CloudStorage){ try{ tg.CloudStorage.getItem(KEY,(err,v)=>{ let c=null; try{c=v&&JSON.parse(v);}catch(e){}
    res([c,local].filter(Boolean).sort((a,b)=>(b.money+b.best*50)-(a.money+a.best*50))[0]||null); }); return; }catch(e){} }
  res(local); }); }
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) save(); });

// ---- технический перерыв и админ-меню ----
let paused=false, MAINT=false, MSG=MAINT_DEFAULT;
function getCfg(){ return new Promise(res=>{ if(typeof fetch!=='function') return res(null);
  const to=setTimeout(()=>res(null),3000);
  fetch('config.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{ clearTimeout(to); res(j); }).catch(()=>{ clearTimeout(to); res(null); }); }); }
function applyCfg(c){
  if(!c) return; MAINT=!!c.maintenance; MSG=c.message||MAINT_DEFAULT;
  const lock=MAINT&&!isAdmin;
  if(lock&&!paused){ paused=true; auto=false; syncAuto(); dir=[0,0]; save(); }
  if(!lock) paused=false;
  const m=document.getElementById('maint'); m.hidden=!lock; document.getElementById('mtMsg').textContent=MSG;
  const ab=document.getElementById('admOpen'); if(ab) ab.classList.toggle('warn',MAINT);
  if(isAdmin&&adm&&adm.classList.contains('open')) admRender(); }
document.getElementById('mtLogo').src=LOGO;
document.getElementById('mtRetry').onclick=()=>{ getCfg().then(c=>{ if(c) applyCfg(c); }); };
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) getCfg().then(applyCfg); });

let adm=null;
if(isAdmin){
  adm=document.createElement('div'); adm.id='adm'; document.querySelector('.cv').appendChild(adm);
  const ab=document.createElement('button'); ab.id='admOpen'; ab.setAttribute('aria-label','Админ-панель');
  ab.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>';
  document.querySelector('.top').insertBefore(ab,document.getElementById('money'));
  ab.onclick=()=>{ admRender(); adm.classList.add('open'); };
}
function admRender(){
  const L=window.location; let owner=GH.owner, repo=GH.repo;
  if(!owner&&/\.github\.io$/.test(L.hostname)){ owner=L.hostname.split('.')[0]; repo=L.pathname.split('/')[1]||L.hostname; }
  const ready=!!(owner&&repo), url='https://github.com/'+owner+'/'+repo+'/edit/'+GH.branch+'/config.json';
  adm.innerHTML='<button class="it" id="admX">Закрыть</button>'
   +'<div class="adm-card"><b>Админ-панель</b><span class="dim">Сейчас для игроков: '+(MAINT?'технический перерыв (вы заходите как админ)':'игра открыта')+'</span></div>'
   +'<button class="it" id="admT"'+(ready?'':' disabled')+'><span>'+(MAINT?'Выключить':'Включить')+' технический перерыв<small>Откроется GitHub: поменяй '+(MAINT?'true на false':'false на true')+' и нажми Commit</small></span></button>'
   +(ready?'':'<div class="adm-card dim">Не удалось определить репозиторий. Впиши owner и repo в блок GH в начале кода.</div>')
   +'<div class="sec">Выдать себе</div><div class="adm-grid"><button class="it" data-g="m10k">+10 000 ₴</button><button class="it" data-g="m1m">+1 000 000 ₴</button><button class="it" data-g="d50">Динамит ×50</button><button class="it" data-g="b20">Батареи ×20</button><button class="it" data-g="max">Все улучшения на максимум</button><button class="it" data-g="full">Сдать груз и зарядиться</button></div>'
   +'<div class="adm-card"><span class="dim">Уровень улучшения</span><select id="admU">'+UPS.map(u=>'<option value="'+u.id+'">'+u.name+'</option>').join('')+'</select><input id="admL" type="number" min="0" placeholder="Уровень, например 5"><button class="it" id="admSetL">Поставить уровень</button></div>'
   +'<div class="adm-card"><span class="dim">Телепорт на глубину, метры (0–'+(H-SURF-1)+')</span><input id="admD" type="number" min="0" placeholder="Например 500"><button class="it" id="admTp">Телепортироваться</button></div>'
   +'<div class="dim adm-msg" id="admMsg">После сохранения config.json у игроков меняется через 1–2 минуты.</div>';
  document.getElementById('admX').onclick=()=>{ adm.classList.add('closing'); setTimeout(()=>adm.classList.remove('open','closing'),190); };
  const msg=t=>{ const e=document.getElementById('admMsg'); if(e) e.textContent=t; };
  adm.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{ const g=b.dataset.g;
    if(g==='m10k') P.money+=10000; if(g==='m1m') P.money+=1000000; if(g==='d50') P.dyn+=50; if(g==='b20') P.bat+=20;
    if(g==='max') UPS.forEach(u=>{ P.up[u.id]=u.max||20; });
    if(g==='full') sell();
    energy=Math.min(energy,enMax()); save(); msg('Готово'); });
  document.getElementById('admSetL').onclick=()=>{ const u=UPS.find(x=>x.id===document.getElementById('admU').value); let L=parseInt(document.getElementById('admL').value); if(!u||!(L>=0)) return msg('Введите уровень');
    if(u.max) L=Math.min(L,u.max); P.up[u.id]=L; energy=Math.min(energy,enMax()); save(); msg(u.name+': уровень '+L); };
  document.getElementById('admTp').onclick=()=>{ let d=parseInt(document.getElementById('admD').value); if(!(d>=0)) return msg('Введите глубину');
    d=Math.min(d,H-SURF-1); pl.y=SURF+d; if(d>0) world[pl.y][pl.x]=0; energy=enMax(); auto=false; syncAuto(); dir=[0,0];
    adm.classList.remove('open'); toast('Телепорт: '+d+' м'); };
  const bt=document.getElementById('admT'); if(bt) bt.onclick=()=>{ if(tg&&tg.openLink) tg.openLink(url); else window.open(url,'_blank'); };
}
function fit(){
  const r=cv.parentElement.getBoundingClientRect(); if(!r.width||!r.height) return;
  const w=Math.min(r.width-4,720), k=w/384, rows=Math.max(8,Math.min(22,Math.floor((r.height-4)/k/T)));
  if(rows!==VH){ VH=rows; cv.height=VH*T; mkGR(); }
  cv.style.width=w+'px'; cv.style.height=(VH*T*k)+'px'; }
window.addEventListener('resize',fit); if(window.ResizeObserver) new ResizeObserver(fit).observe(cv.parentElement);
if(tg&&tg.onEvent) tg.onEvent('viewportChanged',fit); fit();
Promise.all([Promise.race([load(), new Promise(r=>setTimeout(()=>{ let l=null; try{ l=JSON.parse(localStorage.getItem(KEY+':'+uid)); }catch(e){} r(l); },4000))]), getCfg()]).then(([s,cfg])=>{ if(s) P=Object.assign(P,s,{up:Object.assign(P.up,s.up)}); gen(); requestAnimationFrame(loop); applyCfg(cfg); setInterval(()=>getCfg().then(applyCfg),60000); setTimeout(hideSplash,Math.max(0,1900-(performance.now()-T0))); });
</script>
